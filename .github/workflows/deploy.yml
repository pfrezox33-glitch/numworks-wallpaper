name: Build and deploy NumWorks Wallpaper
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Epsilon app toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi nodejs npm
      - name: Build Epsilon wallpaper app
        run: |
          make clean
          make build
          mkdir -p site
          cp index.html site/index.html
          cp output/wallpaper.nwa site/wallpaper.nwa
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
