name: Build and deploy NumWorks Themes
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi nodejs npm python3 git
          sudo npm install --global nwlink@0.0.16
      - name: Fetch official Epsilon EADK headers
        run: git clone --depth 1 https://github.com/numworks/epsilon.git epsilon-sdk
      - name: Build Epsilon themes app
        run: |
          python3 tools/make_icon.py src/icon.png
          make clean
          make build
          test -s output/app.nwa
          mkdir -p site
          cp index.html site/index.html
          cp output/app.nwa site/themes.nwa
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
